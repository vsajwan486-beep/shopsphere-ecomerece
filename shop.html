
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | ShopSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

    <header class="header">
        <a href="index.html" class="logo">Shop<span>Sphere</span></a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="cart.html">Cart</a>
        </nav>

        <div class="header-actions">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">☀️</button>
            <a href="cart.html" class="cart-link">
                🛒 Cart <span id="cart-count">0</span>
            </a>
        </div>
    </header>

    <main class="shop-page">

        <section class="shop-heading">
            <p class="section-label">OUR COLLECTION</p>
            <h1>Explore Our Products</h1>
            <p>Find the perfect products for your everyday needs.</p>
        </section>

        <section class="shop-controls">

            <input
                type="search"
                id="search-input"
                placeholder="Search products..."
                aria-label="Search products"
            >

            <select id="category-filter" aria-label="Filter by category">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home</option>
                <option value="Accessories">Accessories</option>
            </select>

            <select id="sort-filter" aria-label="Sort products">
                <option value="default">Sort: Default</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>

        </section>

        <section class="shop-products-section">

            <div class="section-heading">
                <h2>All Products</h2>
                <span id="product-count">12 Products</span>
            </div>

            <div id="shop-product-grid" class="product-grid">
                <!-- Products generated by JavaScript -->
            </div>

            <div id="no-products" class="empty-cart" hidden>
                <span>🔍</span>
                <h3>No products found</h3>
                <p>Try another search or category.</p>
            </div>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 ShopSphere. All rights reserved.</p>
        <p>Demo shopping website · No real payments accepted</p>
    </footer>

</div>

<script src="js/products.js"></script>
<script src="js/common.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
